theme: jekyll-theme-minimal

# Core identity
title: "Daniel Atilano Barbosa, Ph.D."
description: "Social and Cognitive Neuroscientist | Social Brain, Multimodal Neuroimaging, Population Neuroscience"
lang: "en"

# GitHub Pages URL settings
url: "https://daniel-atilano.github.io"
baseurl: "/cv.github.io"

# Author / contact / social
author:
  name: "Daniel Atilano Barbosa, Ph.D."
  email: ""
github_username: "Daniel-atilano"
twitter_username: ""

# Social preview image
image: "/assets/images/og-image.svg"

# Build settings
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

collections:
  publications:
    output: true
    permalink: /publications/:path/

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Daniel Atilano Barbosa, Ph.D."
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

sitemap:
  changefreq: weekly
  priority: 0.8
